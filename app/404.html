<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="robots" content="noindex" />
  <title>Not found — Project Board</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <!-- Cloudflare serves this for any path that isn't a file (wrangler.jsonc:
       not_found_handling), at that path, so every URL here is absolute.
       No scripts (CSP); shipped, not precached (build.sh NOT_PRECACHED). -->
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .nf {
      max-width: 480px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 64px) 22px 48px;
      text-align: center;
      line-height: 1.6;
      font-size: var(--text-base);
    }
    .nf img { width: 64px; height: 64px; border-radius: var(--radius-md); margin-bottom: 18px; }
    .nf h1 { font-size: var(--text-5xl); font-weight: 800; line-height: 1.2; margin-bottom: 8px; }
    .nf p { color: var(--text-soft); margin-bottom: 24px; }
  </style>
</head>
<body>
<main class="nf">
  <img src="/icon.svg" alt="" />
  <h1>Nothing here</h1>
  <p>That page doesn’t exist. The problems, circuits and Ranks are all in the app.</p>
  <a class="btn-block btn-primary" href="/">Open Project Board</a>
</main>
</body>
</html>
