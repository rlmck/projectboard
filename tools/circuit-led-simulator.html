<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuit LED simulator · Project Board</title>
<!--
  The circuit LED look on the board, simulated: "map and next hold" (Ross, 5 Nov 2026;
  it replaced direction 4, "Pulse and fade", and the circuit-track lighting).
  A PORT OF pi/listener/circuit.py, kept in step with it: runFrame() here is Run.layers()
  there (blink(), matchOn(), the laps, the top). Change both together; contract 8.3
  (docs/cast-contract.md). Open it from the repo (tools/circuit-led-simulator.html) so the
  board photo loads from ../app/; the circuits are read live with the public anon key.
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0a; --surface: #161616; --surface2: #202020; --border: #2c2c2c;
    --accent: #be185d; --accent-hover: #db2777;
    --start: #22c55e; --int: #3b82f6; --finish: #ef4444;
    --text: #f5f5f5; --muted: #9a9a9a; --faint: #55556a;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --r: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; padding: 16px 20px; max-width: 1560px; margin: 0 auto; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; padding: 16px; } }

  .stage { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .board-wrap { position: relative; background: #000; border-radius: var(--r); overflow: hidden; border: 1px solid var(--border); }
  canvas { display: block; width: auto; height: auto; max-width: 100%; max-height: calc(100vh - 190px); margin: 0 auto; }
  @media (max-width: 960px) { canvas { max-height: none; width: 100%; } }
  .big-count { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
    font-size: clamp(60px, 14vw, 180px); font-weight: 800; color: transparent; }

  .readout { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 16px; }
  .phase { font-size: 26px; font-weight: 700; min-width: 7ch; }
  .sub { color: var(--muted); font-size: 14px; }
  .beatbar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .beatbar i { display: block; height: 100%; width: 0; background: var(--start); }
  .now { font-size: 14px; display: grid; gap: 2px; text-align: right; }
  .now b { font-weight: 600; }

  .seq { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 12px/1 var(--mono); padding: 6px 7px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
  .chip.done { color: #444; border-color: #1c1c1c; }
  .chip.target { color: #000; background: var(--start); border-color: var(--start); }
  .chip.start { box-shadow: inset 0 -3px 0 var(--start); }
  .chip.finish { box-shadow: inset 0 -3px 0 var(--finish); }

  aside { display: flex; flex-direction: column; gap: 12px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 10px; }
  .panel h2 { margin: 0; font-size: 15px; font-weight: 650; }
  .panel p { margin: 0; color: var(--muted); font-size: 13px; }
  label.field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  label.field output { color: var(--text); font-family: var(--mono); }
  select { width: 100%; background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: inherit; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .seg { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 6px 4px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: #333; color: var(--text); }
  .row { display: flex; gap: 8px; align-items: center; }
  .laps { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  .stepper { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; background: var(--surface2); }
  .stepper button { border: 0; background: transparent; color: var(--text); font: inherit; font-size: 18px; width: 36px; height: 34px; cursor: pointer; }
  .stepper output { min-width: 5.5ch; text-align: center; font-variant-numeric: tabular-nums; }
  .stepper.off { opacity: .35; }
  .stepper.off button { cursor: default; }
  .btn { border: 1px solid var(--border); background: var(--surface2); color: var(--text); font: inherit; font-weight: 600; padding: 10px 14px; border-radius: 8px; cursor: pointer; }
  .btn:hover { background: #2a2a2a; }
  .btn.primary { background: var(--accent); border-color: var(--accent); flex: 1; font-size: 16px; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.icon { padding: 10px 12px; min-width: 44px; }
  .btn:disabled { opacity: .35; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .opt { display: grid; gap: 5px; }
  .opt > span { font-size: 13px; color: var(--muted); }
  .note { font-size: 12px; color: var(--faint); }

  .legend { display: grid; gap: 6px; font-size: 13px; }
  .legend div { display: flex; gap: 8px; align-items: baseline; }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; transform: translateY(1px); }
  kbd { font: 11px var(--mono); background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; }
</style>
</head>
<body>
<main>
  <section class="stage">
    <div class="board-wrap">
      <canvas id="board" width="1386" height="1135" aria-label="Board with simulated LEDs"></canvas>
      <div class="big-count" id="bigCount"></div>
    </div>

    <div class="readout">
      <div class="phase" id="phase">Ready</div>
      <div>
        <div class="sub" id="sub">Pick a circuit and press Start.</div>
        <div class="beatbar"><i id="beat"></i></div>
      </div>
      <div class="now" id="now"></div>
    </div>

    <div class="seq" id="seq" aria-label="The circuit's holds in order"></div>
  </section>

  <aside>
    <div class="panel">
      <h2>Run</h2>
      <label class="field">Circuit
        <select id="circuit"></select>
      </label>
      <p id="srcNote"></p>
      <div class="opt"><span>Speed (a move)</span>
        <div class="seg" data-opt="speed">
          <button data-v="5">Slow 5 s</button><button data-v="3">Med 3 s</button><button data-v="2">Fast 2 s</button>
        </div>
      </div>
      <div class="opt"><span>Laps</span>
        <div class="laps">

          <div class="stepper" id="stepper">
            <button id="lapsDown" aria-label="One lap fewer">−</button>
            <output id="lapsOut" aria-live="polite">1 lap</output>
            <button id="lapsUp" aria-label="One lap more">+</button>
          </div>
        </div>
        <p class="note" id="lapsNote"></p>
      </div>
      <div class="row">
        <button class="btn primary" id="startBtn">Start</button>
        <button class="btn icon" id="backBtn" disabled title="Back one move (←)">◀</button>
        <button class="btn icon" id="pauseBtn" disabled title="Pause (space)">❚❚</button>
        <button class="btn icon" id="fwdBtn" disabled title="Forward one move (→)">▶</button>
      </div>
      <button class="btn" id="matchBtn" hidden>Jump to the match</button>
      <p class="note"><kbd>Space</kbd> start or pause, <kbd>←</kbd> <kbd>→</kbd> step a move, <kbd>Esc</kbd> stop.</p>
    </div>

    <div class="panel">
      <h2>Levels</h2>
      <p>As the Pi's config keys (before its cast <code>BRIGHTNESS</code>).</p>
      <label class="field">Map, <code>CIRCUIT_MAP_LEVEL</code> <output id="mapOut"></output>
        <input type="range" id="mapLevel" min="0.05" max="0.6" step="0.01"></label>
      <label class="field">Finish, <code>CIRCUIT_FINISH_LEVEL</code> <output id="finOut"></output>
        <input type="range" id="finishLevel" min="0.1" max="1" step="0.01"></label>
    </div>

    <div class="panel">
      <h2>What the lights mean</h2>
      <div class="legend" id="legend"></div>
    </div>
  </aside>
</main>

// ── The look: a port of pi/listener/circuit.py (keep the two in step) ───────
const COUNTDOWN = 5;
const MAX_LAPS = 10;
const GREEN = [0, 255, 0], BLUE = [0, 0, 255], RED = [255, 0, 0], OFF = [0, 0, 0];
const BLINK_FULL = 0.08, BLINK_FADE = 0.8;          // full, then a linear fade to off, once a second
const MATCH_OFF = [[0, 0.15], [0.30, 0.45]];        // s into a match beat when its green is off
const TOP_BLINKS = 3, TOP_FADE = 1;                 // three red blinks, then the map fades out

function blink(x) {
  x = ((x % 1) + 1) % 1;
  if (x < BLINK_FULL) return 1;
  if (x < BLINK_FULL + BLINK_FADE) return Math.max(0, 1 - (x - BLINK_FULL) / BLINK_FADE);
  return 0;
}
const matchOn = x => MATCH_OFF.some(([a, b]) => a <= x && x < b) ? 0 : 1;
const over = (top, a, under) => top.map((v, i) => v * a + under[i] * (1 - a));
const scale = (rgb, k) => rgb.map(v => v * k);

// circuit.resolve_laps: loops false always runs 1 lap; Loop = 0 (endless), else the stepper.
const resolveLaps = (loop, laps, loops) => !loops ? 1 : loop ? 0 : laps;
const lapsText = n => n === 0 ? 'endless' : n === 1 ? '1 lap' : `${n} laps`;

// circuit.Run
function makeRun(c, interval, laps, mapLevel, finishLevel) {
  const seq = c.hold_sequence, L = seq.length, s = Math.max(1, Math.min(c.start_count || 1, 2, L));
  const R = { seq, L, s, interval, laps, endless: laps === 0, mapLevel, finishLevel, finish: seq[L - 1] };
  R.moves = R.endless ? null : (L - s) + (laps - 1) * L;
  R.hold = i => seq[((i % L) + L) % L];
  R.target = k => s + k;
  R.lapOf = k => Math.floor(R.target(k) / L) + 1;
  R.isMatch = k => { const i = R.target(k); return [i - 1, i - 2].some(j => j >= 0 && R.hold(j) === R.hold(i)); };
  return R;
}
const topLength = () => TOP_BLINKS + TOP_FADE;
function phaseOf(R, t) {
  if (t < COUNTDOWN) return 'count';
  if (R.endless) return 'run';
  const after = t - COUNTDOWN - R.moves * R.interval;
  return after < 0 ? 'run' : after < topLength() ? 'top' : 'done';
}
// Run.layers(): {holds: Map(hold id -> [r, g, b] 0-255), done}
function runFrame(R, t) {
  const ph = phaseOf(R, t);
  if (ph === 'done') return { holds: new Map(), done: true };
  const blue = scale(BLUE, R.mapLevel);
  const out = new Map(R.seq.map(h => [h, blue]));
  if (ph === 'top') {
    const after = t - COUNTDOWN - R.moves * R.interval;
    out.set(R.finish, OFF);
    if (after < TOP_BLINKS) out.set(R.finish, over(RED, blink(after), OFF));
    else { const fade = Math.max(0, 1 - (after - TOP_BLINKS) / TOP_FADE); out.forEach((rgb, h) => out.set(h, scale(rgb, fade))); }
    return { holds: out, done: false };
  }
  let k = 0, final;
  if (ph === 'count') final = R.laps === 1;
  else { k = Math.floor((t - COUNTDOWN) / R.interval); final = !R.endless && R.lapOf(k) === R.laps; }
  if (final) out.set(R.finish, scale(RED, R.finishLevel));
  if (ph === 'count') {
    const a = blink(t);
    for (let i = 0; i < R.s; i++) { const h = R.hold(i); out.set(h, over(GREEN, a, out.get(h) || OFF)); }
    return { holds: out, done: false };
  }
  const x = (t - COUNTDOWN) - k * R.interval;
  const a = R.isMatch(k) ? matchOn(x) : 1;
  const h = R.hold(R.target(k));
  out.set(h, over(GREEN, a, out.get(h) || OFF));
  return { holds: out, done: false };
}

}
function savePrefs() {
  try { localStorage.setItem(STORE, JSON.stringify(opts)); } catch (e) { /* ignore */ }
}

// ── Circuits ─────────────────────────────────────────────────────────────────
const COLS = 'ABCDEFGHIJKLMNOPQRS';
const holdLabel = h => { const n = parseInt(String(h).slice(4), 10); return COLS[(n - 1) % 19] + (Math.floor((n - 1) / 19) + 1); };
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

// A made-up circuit from real hold positions, used when the live list can't load.
function demoCircuit() {
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const ids = Object.keys(HOLDS);
  const px = h => [HOLDS[h].x * 13.86, HOLDS[h].y * 11.35];
  const dist = (a, b) => { const [ax, ay] = px(a), [bx, by] = px(b); return Math.hypot(ax - bx, ay - by); };
  const low = ids.filter(h => HOLDS[h].y > 70 && HOLDS[h].x > 30 && HOLDS[h].x < 70).sort((a, b) => HOLDS[a].x - HOLDS[b].x);
  const seq = [low[Math.floor(low.length / 2) - 1], low[Math.floor(low.length / 2) + 1]];
  while (seq.length < 16) {
    const cur = seq[seq.length - 1], prev = seq[seq.length - 2];
    const cands = ids.filter(h => !seq.includes(h) && dist(h, cur) > 90 && dist(h, cur) < 210 && dist(h, prev) < 300
      && HOLDS[h].y < HOLDS[cur].y + 2 && HOLDS[h].y > HOLDS[cur].y - 9);
    if (!cands.length) break;
    seq.push(cands[Math.floor(rnd() * cands.length)]);
    if (HOLDS[seq[seq.length - 1]].y < 14) break;
  }
  seq.splice(6, 0, seq[5]);     // one match, so its two blinks can be seen
  return { name: 'Demo circuit (made up)', grade: '', hold_sequence: seq, start_count: 2, loops: true };
}

let circuits = [], circ = null;

async function loadCircuits() {
  const sel = document.getElementById('circuit'), note = document.getElementById('srcNote');
  const demo = demoCircuit();
  try {
    const r = await fetch(`${SUPA_URL}/rest/v1/circuits?select=name,grade,hold_sequence,start_count,loops&order=name`,
      { headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const rows = (await r.json()).filter(c => Array.isArray(c.hold_sequence) && c.hold_sequence.length >= 3);
    if (!rows.length) throw new Error('no circuits');
    circuits = rows.concat([demo]);
    note.textContent = `${rows.length} live circuits from the app, read just now.`;
  } catch (e) {
    circuits = [demo];
    note.textContent = `Couldn't load the live circuits (${e.message}), so this is a made-up one on the real holds.`;
  }
  sel.innerHTML = circuits.map((c, i) => `<option value="${i}">${esc(c.name)}${c.grade ? ' (' + esc(c.grade) + ')' : ''}${c.loops ? ' ↻' : ''}</option>`).join('');
  const pb = Math.max(0, circuits.findIndex(c => /pat\s*burner/i.test(c.name)));
  sel.value = String(pb);
  pickCircuit(pb);
}

function pickCircuit(i) {
  stop();
  circ = circuits[i];
  syncLaps();
  render();
}
const lapsNow = () => resolveLaps(opts.loop, opts.laps, !!circ.loops);
const currentRun = () => makeRun(circ, opts.speed, lapsNow(), opts.mapLevel, opts.finishLevel);

// The first move that's a match, or -1.
function firstMatch(R) {
  const n = R.endless ? R.L : R.moves;
  for (let k = 0; k < n; k++) if (R.isMatch(k)) return k;
  return -1;
}
// Run from two moves before the match, so you see it coming and then the two blinks.
function jumpToMatch() {
  const R = currentRun(), k = firstMatch(R); if (k < 0) return;
  if (!running) start();
  paused = false; t = COUNTDOWN + Math.max(0, k - 2) * opts.speed + 0.01; last = performance.now(); syncButtons();
}

// ── Readout ──────────────────────────────────────────────────────────────────
function readout(R, t) {
  const ph = phaseOf(R, t), info = { phase: '', sub: '', beatFrac: 0, big: '', now: [] };
  let roles = {};
  if (ph === 'count') {
    for (let i = 0; i < R.s; i++) roles[i] = 'target';
    info.phase = info.big = String(Math.max(1, Math.ceil(COUNTDOWN - t)));
    info.sub = `Get on the start holds · ${lapsText(R.laps)}`;
    info.beatFrac = t - Math.floor(t);
    info.now = [['Start', Array.from({ length: R.s }, (_, i) => R.hold(i))]];
  } else if (ph === 'top' || ph === 'done') {
    R.seq.forEach((_, p) => { roles[p] = 'done'; });
    info.phase = 'Top!';
    info.sub = `${R.moves} moves, ${lapsText(R.laps)}`;
    info.beatFrac = Math.min(1, (t - COUNTDOWN - R.moves * R.interval) / topLength());
  } else {
    const k = Math.floor((t - COUNTDOWN) / R.interval), i = R.target(k), p = ((i % R.L) + R.L) % R.L, lap = R.lapOf(k);
    for (let q = (lap === 1 ? R.s : 0); q < p; q++) roles[q] = 'done';
    roles[p] = 'target';
    info.phase = `Move ${k + 1}`;
    info.sub = (R.endless ? `lap ${lap} · until stopped` : `of ${R.moves} · lap ${lap} of ${R.laps}`) + (R.isMatch(k) ? ' · match' : '');
    info.beatFrac = ((t - COUNTDOWN) - k * R.interval) / R.interval;
    info.now = [['Go to', [R.hold(i) + (R.isMatch(k) ? ' (match)' : '')]]];
  }
  return { roles, info };
}

// ── Drawing ──────────────────────────────────────────────────────────────────
const cv = document.getElementById('board'), ctx = cv.getContext('2d');
const img = new Image(); img.src = BOARD_IMG; img.onload = () => render();
const W = cv.width, H = cv.height, RAD = W * 0.034;

// A screen shows a dim LED dimmer than the eye sees it on the wall, so the glow's alpha is
// lifted at low levels (display only: the colours are the Pi's, before its BRIGHTNESS).
function draw(holds) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (img.complete && img.naturalWidth) {
    ctx.drawImage(img, 0, 0, W, H);
    ctx.fillStyle = 'rgba(0,0,0,0.82)'; ctx.fillRect(0, 0, W, H);
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const [h, rgb] of holds) {
    const p = HOLDS[h], m = Math.max(...rgb);
    if (!p || m <= 1) continue;
    const [r, g, b] = rgb.map(v => Math.round(v / m * 255)), a = Math.pow(m / 255, 0.6);
    const x = p.x / 100 * W, y = p.y / 100 * H;
    const gr = ctx.createRadialGradient(x, y, 0, x, y, RAD);
    gr.addColorStop(0, `rgba(${r},${g},${b},${0.95 * a})`);
    gr.addColorStop(0.25, `rgba(${r},${g},${b},${0.55 * a})`);
    gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, RAD, 0, 7); ctx.fill();
    ctx.fillStyle = `rgba(255,255,255,${0.7 * a})`;
    ctx.beginPath(); ctx.arc(x, y, W * 0.0045, 0, 7); ctx.fill();
  }
}

function drawSeq(R, roles) {
  const final = R.laps !== 0;
  document.getElementById('seq').innerHTML = R.seq.map((h, p) => {
    const cls = ['chip', roles[p] || '', p < R.s ? 'start' : '', final && p === R.L - 1 ? 'finish' : ''].join(' ');
    return `<span class="${cls}" title="Position ${p}">${p + 1}·${holdLabel(h)}</span>`;
  }).join('');
}

function drawLegend() {
  const n = circ ? lapsNow() : 1;
  const rows = [
    ['var(--int)', `The map: every hold of the circuit blue at ${Math.round(opts.mapLevel * 100)}%, all through the countdown and the run`],
    ['var(--start)', 'Countdown, 5 s: the start holds blink green once a second (full, then a fade to off)'],
    ['var(--start)', 'The run: only the hold to go to, green, full and solid; the start holds are blue'],
    ['var(--start)', 'A match (going to a hold you\'re on): the green blinks twice at the start of its beat'],
  ];
  if (n === 0) rows.push(['#555', 'Endless: no red finish; it runs until Stop']);
  else {
    rows.push(['var(--finish)', `The finish: red at ${Math.round(opts.finishLevel * 100)}%, on the final lap only` + (n === 1 ? ' (here from the countdown on)' : '')]);
    rows.push(['var(--finish)', 'The top: the finish blinks red three times, then the map fades out over 1 s']);
  }
  document.getElementById('legend').innerHTML = rows.map(([c, t]) => `<div><span class="dot" style="background:${c}"></span><span>${t}</span></div>`).join('');
}

// ── Running ──────────────────────────────────────────────────────────────────
let t = 0, running = false, paused = false, last = 0;
function frame(now) {
  if (!running) return;
  if (!paused) t += Math.min(0.1, (now - last) / 1000);
  last = now;
  if (render().done) { stop(); return; }
  requestAnimationFrame(frame);
}
function render() {
  if (!circ) return { done: false };
  const R = currentRun();
  const tt = running ? t : 0;                 // not running: the cast's first frame, as the board shows it
  const f = runFrame(R, tt), m = readout(R, tt);
  if (!running) {
    m.info = { phase: 'Ready', sub: `${R.L} holds, ${R.s} to start${circ.loops ? ', loops' : ', runs once'} · ${lapsText(R.laps)}` +
      (R.endless ? '' : `, ${R.moves} moves`) + '. Press Start.', beatFrac: 0, big: '', now: [] };
    m.roles = {};
  }
  draw(f.holds); drawSeq(R, m.roles);
  document.getElementById('phase').textContent = m.info.phase;
  document.getElementById('sub').textContent = m.info.sub;
  document.getElementById('beat').style.width = (Math.max(0, Math.min(1, m.info.beatFrac)) * 100).toFixed(1) + '%';
  const big = document.getElementById('bigCount'); big.textContent = m.info.big || '';
  big.style.color = m.info.big ? 'rgba(255,255,255,0.12)' : 'transparent';
  document.getElementById('now').innerHTML = (m.info.now || []).filter(([, hs]) => hs.length)
    .map(([k, hs]) => `<div><span class="sub">${k}</span> <b>${hs.map(h => h.replace(/hold\d+/, x => holdLabel(x))).join(', ')}</b></div>`).join('');
  document.getElementById('matchBtn').hidden = firstMatch(R) < 0;
  return f;
}

function start() { t = 0; running = true; paused = false; last = performance.now(); syncButtons(); requestAnimationFrame(frame); }
function stop() { running = false; paused = false; syncButtons(); render(); }
function togglePause() { if (!running) return start(); paused = !paused; last = performance.now(); syncButtons(); }
function step(dir) {
  if (!running) return;
  paused = true;
  if (t < COUNTDOWN) t = dir > 0 ? COUNTDOWN + 0.5 : 0;
  else {
    const b = Math.floor((t - COUNTDOWN) / opts.speed) + dir;
    t = b < 0 ? COUNTDOWN - 1 : COUNTDOWN + b * opts.speed + 0.5;
  }
  syncButtons(); render();
}
function syncButtons() {
  document.getElementById('startBtn').textContent = running ? 'Stop' : 'Start';
  const pb = document.getElementById('pauseBtn'); pb.disabled = !running; pb.textContent = paused ? '▶' : '❚❚';
  pb.title = paused ? 'Play (space)' : 'Pause (space)';
  document.getElementById('backBtn').disabled = !running;
  document.getElementById('fwdBtn').disabled = !running;
}

// ── Controls ─────────────────────────────────────────────────────────────────
function setSpeed(v) {
  if (running && t > COUNTDOWN) t = COUNTDOWN + (t - COUNTDOWN) / opts.speed * v;    // the same move, the same point in it
  opts.speed = v;
  document.querySelectorAll('.seg[data-opt="speed"] button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === v)));
  savePrefs();
  if (!running || paused) render();
}
function syncLaps() {
  const loops = !circ || !!circ.loops;
  const box = document.getElementById('loop');
  box.checked = opts.loop && loops; box.disabled = !loops;
  const off = opts.loop || !loops;
  document.getElementById('stepper').classList.toggle('off', off);
  document.getElementById('lapsDown').disabled = off || opts.laps <= 1;
  document.getElementById('lapsUp').disabled = off || opts.laps >= MAX_LAPS;
  document.getElementById('lapsOut').textContent = lapsText(loops ? opts.laps : 1);
  document.getElementById('lapsNote').textContent = !loops
    ? 'This circuit doesn\'t loop, so it always runs 1 lap (the Pi ignores Loop and laps for it).'
    : opts.loop ? 'Endless: until Stop (or the Pi\'s CIRCUIT_MAX_S).' : '';
  drawLegend();
}
function setLaps(loop, laps) {
  if (running) stop();
  opts.loop = loop; opts.laps = Math.max(1, Math.min(MAX_LAPS, laps));
  savePrefs(); syncLaps(); render();
}

loadPrefs();
[['mapLevel', 'mapOut'], ['finishLevel', 'finOut']].forEach(([key, out]) => {
  const e = document.getElementById(key), o = document.getElementById(out);
  const show = () => { o.textContent = opts[key].toFixed(2); };
  e.value = opts[key]; show();
  e.addEventListener('input', () => { opts[key] = Number(e.value); show(); savePrefs(); drawLegend(); if (!running || paused) render(); });
});
document.querySelector('.seg[data-opt="speed"]').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) setSpeed(+b.dataset.v);
});
setSpeed(opts.speed);
document.getElementById('loop').addEventListener('change', e => setLaps(e.target.checked, opts.laps));
document.getElementById('lapsDown').addEventListener('click', () => setLaps(false, opts.laps - 1));
document.getElementById('lapsUp').addEventListener('click', () => setLaps(false, opts.laps + 1));
document.getElementById('circuit').addEventListener('change', e => pickCircuit(+e.target.value));
document.getElementById('startBtn').addEventListener('click', () => running ? stop() : start());
document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('backBtn').addEventListener('click', () => step(-1));
document.getElementById('fwdBtn').addEventListener('click', () => step(1));
document.getElementById('matchBtn').addEventListener('click', jumpToMatch);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'Escape') stop();
});

loadCircuits();
</script>
</body>
</html>
