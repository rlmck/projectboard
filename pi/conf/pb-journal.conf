# /etc/systemd/journald.conf.d/pb-journal.conf: keep the journal across reboots
# (the Wi-Fi faults were only found from earlier boots' logs), but spare the SD card
# (31 Oct 2026, after the first card died): capped at 100 MB and a month, debug
# lines not stored, and written to the card every 15 minutes rather than every 5
# (warnings and worse are still written at once). Overrides Raspberry Pi OS's
# 40-rpi-volatile-storage.conf, which keeps it in RAM only.
[Journal]
Storage=persistent
SystemMaxUse=100M
MaxRetentionSec=1month
MaxLevelStore=info
SyncIntervalSec=15m
